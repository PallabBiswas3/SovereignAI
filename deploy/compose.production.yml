name: sovereign-production

x-runtime: &runtime
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  pids_limit: 256
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

x-python: &python
  <<: *runtime
  image: sovereign-python:${SOVEREIGN_IMAGE_TAG:-production-candidate}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  user: "10001:10001"
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 1536m
  cpus: 2.0
  stop_grace_period: 45s
  environment: &cpu
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"
    OPENBLAS_NUM_THREADS: "2"
    MPLCONFIGDIR: /tmp/matplotlib
    HF_HOME: /tmp/huggingface
  volumes:
    - ./models:/models:ro
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 120s

services:
  backend:
    <<: *python
    environment:
      <<: *cpu
      SOVEREIGN_ENVIRONMENT: production
      SOVEREIGN_AUTH_MODE: local
      SOVEREIGN_AUTH_COOKIE_SECURE: "true"
      SOVEREIGN_ALLOWED_ORIGINS: '["https://${SOVEREIGN_HOST:-localhost}:${HTTPS_PORT:-8443}"]'
      SOVEREIGN_ALLOW_DETERMINISTIC_FALLBACK: "false"
      SOVEREIGN_INTEGRATION_FAIL_CLOSED: "true"
      SOVEREIGN_DEMO_ORG_ENABLED: "false"
      SOVEREIGN_GRAPHRAG_SERVICE_TOKEN_FILE: /run/secrets/graphrag_token
      SOVEREIGN_DATABASE_URL: sqlite:////app/backend/data/sovereign.db
      SOVEREIGN_MODELS_CONFIG: /app/config/models.docker.yaml
      SOVEREIGN_TOOLS_CONFIG: /app/deploy/tools.production.yaml
      SOVEREIGN_OLLAMA_URL: http://ollama:11434
      SOVEREIGN_OLLAMA_GENERAL_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen3:4b-instruct}
      SOVEREIGN_OLLAMA_CODER_MODEL: ${OLLAMA_CODER_MODEL:-qwen2.5-coder:7b}
      SOVEREIGN_OLLAMA_VISION_MODEL: ${OLLAMA_VISION_MODEL:-qwen3-vl:4b-instruct}
      SOVEREIGN_GRAPHRAG_URL: http://graphrag:3100
      SOVEREIGN_CONTROLPLANE_URL: http://controlplane:8000
      SOVEREIGN_DIAGNOSTICS_URL: http://diagnostics:8000
      SOVEREIGN_EMBEDDING_ALLOW_HASH_FALLBACK: "false"
      SOVEREIGN_EMBEDDING_MODEL: /models/all-MiniLM-L6-v2
      SOVEREIGN_RERANKER_MODEL: /models/ms-marco-MiniLM-L-6-v2
      SOVEREIGN_SMOKE_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    secrets: [graphrag_token]
    networks: [api, governance, retrieval, inference]
    volumes:
      - backend-data:/app/backend/data
      - workspace:/app/workspace
      - knowledge:/app/knowledge_base
      - organizations:/app/organizations
      - ./models:/models:ro
    depends_on:
      graphrag: {condition: service_healthy}
      controlplane: {condition: service_healthy}
      diagnostics: {condition: service_healthy}
      ollama: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=12)"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s

  frontend:
    <<: *runtime
    image: sovereign-frontend:${SOVEREIGN_IMAGE_TAG:-production-candidate}
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args: {NEXT_PUBLIC_API_URL: ""}
    user: sovereign
    read_only: true
    tmpfs: [/tmp, "/app/.next/cache:uid=10001,gid=10001,mode=0700"]
    networks: [ingress]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  controlplane:
    <<: *python
    working_dir: /app/Controlplane.ai
    command: [python, -m, uvicorn, controlplane.api:app, --host, 0.0.0.0, --port, "8000"]
    environment:
      <<: *cpu
      CONTROLPLANE_ADAPTIVE_VERIFICATION: "1"
      CONTROLPLANE_NLI_MODEL: /models/nli-deberta-v3-small
      CONTROLPLANE_NLI_LOCAL_ONLY: "1"
      CONTROLPLANE_NLI_DEVICE: cpu
    networks: [governance]
    volumes:
      - ./models:/models:ro
      - controlplane-audit:/app/Controlplane.ai/results

  diagnostics:
    <<: *python
    command: [python, -m, uvicorn, tsdiag.api:app, --host, 0.0.0.0, --port, "8000"]
    networks: [governance]

  graphrag:
    <<: *runtime
    image: sovereign-graphrag:${SOVEREIGN_IMAGE_TAG:-production-candidate}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.graphrag
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      OLLAMA_URL: http://ollama:11434
      OLLAMA_GENERATION_MODEL: ${OLLAMA_GENERATION_MODEL:-qwen3:4b-instruct}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_KEEP_ALIVE: 60s
      GRAPHRAG_DENSE_RETRIEVAL_ENABLED: "true"
      SUPABASE_URL: http://gateway:8080
    secrets: [graphrag_token, graph_service_jwt]
    user: node
    read_only: true
    tmpfs: [/tmp]
    networks: [retrieval, inference, graph]
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      graph-rest: {condition: service_started}
      gateway: {condition: service_started}
      ollama: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/health').then(async r=>process.exit(r.ok&&(await r.json()).status==='ok'?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3

  graph-db:
    <<: *runtime
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: evidence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, graph_db_password]
    volumes:
      - graph-data:/var/lib/postgresql/data
      - ./init-graph.sh:/docker-entrypoint-initdb.d/001-base.sh:ro
      - ../Graph-RAG/server/migrations/001_evidence_graph.sql:/docker-entrypoint-initdb.d/002-evidence.sql:ro
      - ./graph-grants.sql:/docker-entrypoint-initdb.d/003-grants.sql:ro
    networks: [graph]
    # Official entrypoint initializes/chowns a fresh volume, then drops to postgres.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, SETUID, SETGID, DAC_OVERRIDE]
    mem_limit: 384m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d evidence"]
      interval: 10s
      timeout: 3s
      retries: 10

  graph-rest:
    <<: *runtime
    image: postgrest/postgrest:v12.2.3
    environment:
      PGRST_DB_URI: "@/run/secrets/graph_rest_uri"
      PGRST_JWT_SECRET: "@/run/secrets/graph_jwt_secret"
      PGRST_DB_SCHEMAS: public
      PGRST_OPENAPI_MODE: disabled
    secrets: [graph_rest_uri, graph_jwt_secret]
    depends_on:
      graph-db: {condition: service_healthy}
    user: "10001:10001"
    read_only: true
    networks: [graph]
    mem_limit: 128m
    cpus: 0.5

  ollama:
    <<: *runtime
    image: ollama/ollama:0.33.2
    # Preserve the supported image's existing root-owned model-volume layout.
    volumes: [ollama-models:/root/.ollama]
    read_only: true
    tmpfs: [/tmp]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 60s
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NOPRUNE: "true"
    networks: [inference]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-5g}
    cpus: ${OLLAMA_CPUS:-4.0}
    pids_limit: 512
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    <<: *runtime
    image: sovereign-gateway:${SOVEREIGN_IMAGE_TAG:-production-candidate}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      SOVEREIGN_HOST: ${SOVEREIGN_HOST:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
    ports: ["${BIND_IP:-127.0.0.1}:${HTTPS_PORT:-8443}:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway-data:/data
      - gateway-config:/config
    read_only: true
    tmpfs: [/tmp]
    networks: [edge, ingress, api, graph]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

networks:
  # Only the TLS gateway joins this bridge, required for host port publication.
  edge: {internal: false}
  ingress: {internal: true}
  api: {internal: true}
  governance: {internal: true}
  retrieval: {internal: true}
  inference: {internal: true}
  graph: {internal: true}

volumes:
  backend-data:
  workspace:
  knowledge:
  organizations:
  controlplane-audit:
  graph-data:
  ollama-models:
  gateway-data:
  gateway-config:

secrets:
  graphrag_token: {file: ./secrets/graphrag_token}
  postgres_password: {file: ./secrets/postgres_password}
  graph_db_password: {file: ./secrets/graph_db_password}
  graph_rest_uri: {file: ./secrets/graph_rest_uri}
  graph_jwt_secret: {file: ./secrets/graph_jwt_secret}
  graph_service_jwt: {file: ./secrets/graph_service_jwt}
