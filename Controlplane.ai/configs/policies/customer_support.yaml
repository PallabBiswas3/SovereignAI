id: customer_support
version: "1.4"
name: Customer Support Assistant
description: Customer-facing policy with strict output privacy controls and evidence-aware factuality verification.
geography: global
industry: general
latency_budget_ms: 30000
default_action: allow

checks:
  privacy:
    enabled: true
    depth: quick
    settings:
      scan_prompt: true
      scan_conversation: false
  bias:
    enabled: true
    depth: quick
  hallucination:
    enabled: true
    depth: standard
    settings:
      use_trained_risk: true
      risk_model: models/phase2/selected_model.joblib
      risk_manifest: models/phase2/manifest.json
      risk_threshold: 0.72
      routing_standard_threshold: 0.30
      routing_deep_threshold: 0.70
      emit_risk_finding: false
      emit_unsupported_entity_findings: false
  conversation:
    enabled: true
    depth: quick

rules:
  - id: customer-secret-block
    description: Credentials and other critical secrets must never be returned.
    when:
      category: privacy
      severity_at_least: critical
    action: block
  - id: customer-pii-redact
    description: Redact personal data from customer-facing output.
    when:
      category: privacy
      severity_at_least: medium
      location_prefix: response
    action: redact
  - id: customer-input-pii-warn
    description: Warn when a customer prompt contains sensitive identifiers.
    when:
      category: privacy
      severity_at_least: medium
      location_prefix: prompt
    action: allow_with_warning
  - id: customer-bias-warn
    description: Surface potentially biased customer-facing language.
    when:
      category: bias
      severity_at_least: medium
    action: allow_with_warning
  - id: customer-contradiction-block
    description: A claim confirmed as contradicted must not reach the customer.
    when:
      category: hallucination
      status: contradicted
    action: block
  - id: customer-untrusted-instruction-block
    description: A retrieved document cannot confer system or developer authority.
    when:
      category: policy
      subtype: untrusted_instruction_promotion
    action: block
  - id: customer-unsupported-warn
    description: Warn when sufficiently complete evidence fails to support a factual claim.
    when:
      category: hallucination
      subtype: claim_unsupported
    action: allow_with_warning
  - id: customer-conflicting-warn
    description: Warn when available evidence sources materially disagree.
    when:
      category: hallucination
      subtype: claim_conflicting
    action: allow_with_warning
  - id: customer-deterministic-conflict-warn
    description: Warn if a deterministic value conflict remains visible at the policy boundary.
    when:
      category: hallucination
      subtype: grounded_value_conflict
    action: allow_with_warning
  - id: customer-control-failure-warn
    description: A failed safety control cannot silently pass.
    when:
      category: policy
      subtype: detector_failure
    action: allow_with_warning
  - id: customer-consequential-control-failure-review
    description: A failed safety control on consequential work fails closed to review.
    when:
      category: policy
      subtype: detector_failure
      consequential_only: true
    action: human_review
  - id: customer-consequential-undecidable-review
    description: Consequential claims that cannot be decided from available evidence require review.
    when:
      category: hallucination
      subtype: claim_undecidable
      consequential_only: true
    action: human_review
  - id: customer-physical-action-review
    description: Current instructions for physical equipment actions require accountable review.
    when:
      category: policy
      subtype: physical_action_requires_review
    action: human_review
  - id: customer-unverified-work-event-review
    description: Do not release categorical work-execution claims without a matching authorized record.
    when:
      category: policy
      subtype: unverified_operational_event
    action: human_review
  - id: customer-compounding-review
    description: Escalate risky claims propagated across conversation turns.
    when:
      category: policy
      subtype: compounding_conversation_risk
    action: human_review

# Diagnostic-only signals (emitted only when explicitly enabled for ablations).
# Any other unmatched HIGH finding is held for review by the policy engine.
informational_subtypes:
  - elevated_response_risk
  - unsupported_entity_claim

warning_template: Verify this response before relying on factual or decision-relevant claims.
blocked_response: This response was blocked because it contains restricted sensitive information or a confirmed factual contradiction.
review_response: This response is awaiting review by a support supervisor.
