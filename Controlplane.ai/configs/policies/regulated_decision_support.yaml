id: regulated_decision_support
version: "1.3"
name: Regulated Decision Support
description: Safety-first policy for consequential workflows requiring human accountability.
geography: global
industry: regulated
latency_budget_ms: 3000
default_action: allow

checks:
  privacy:
    enabled: true
    depth: standard
    settings:
      scan_prompt: true
      scan_conversation: true
  bias:
    enabled: true
    depth: deep
  hallucination:
    enabled: true
    depth: deep
    settings:
      use_trained_risk: true
      risk_model: models/phase2/selected_model.joblib
      risk_manifest: models/phase2/manifest.json
      risk_threshold: 0.55
      routing_standard_threshold: 0.25
      routing_deep_threshold: 0.60
      emit_risk_finding: false
      emit_unsupported_entity_findings: false
  conversation:
    enabled: true
    depth: deep
    settings:
      prior_risk_threshold: 0.45

rules:
  - id: regulated-secret-block
    description: Block critical secrets in regulated output.
    when:
      category: privacy
      severity_at_least: critical
    action: block
  - id: regulated-sensitive-review
    description: Sensitive output requires review rather than silent disclosure.
    when:
      category: privacy
      severity_at_least: medium
    action: human_review
  - id: regulated-bias-review
    description: Potential protected-attribute influence requires a human decision-maker.
    when:
      category: bias
      severity_at_least: medium
    action: human_review
  - id: regulated-contradiction-review
    description: Contradicted factual claims require review.
    when:
      category: hallucination
      status: contradicted
    action: human_review
  - id: regulated-untrusted-instruction-block
    description: A retrieved document cannot confer system or developer authority.
    when:
      category: policy
      subtype: untrusted_instruction_promotion
    action: block
  - id: regulated-consequential-unsupported-review
    description: A consequential claim unsupported by sufficiently complete evidence requires review.
    when:
      category: hallucination
      subtype: claim_unsupported
      consequential_only: true
    action: human_review
  - id: regulated-consequential-conflict-review
    description: Consequential claims with materially conflicting evidence require review.
    when:
      category: hallucination
      subtype: claim_conflicting
      consequential_only: true
    action: human_review
  - id: regulated-consequential-undecidable-review
    description: Consequential claims that cannot be decided from available evidence require review.
    when:
      category: hallucination
      subtype: claim_undecidable
      consequential_only: true
    action: human_review
  - id: regulated-conversation-review
    description: Compounding conversation risk requires review.
    when:
      category: policy
      subtype: compounding_conversation_risk
    action: human_review
  - id: regulated-control-failure-review
    description: Fail closed to human review when a required detector fails.
    when:
      category: policy
      subtype: detector_failure
    action: human_review
  - id: regulated-physical-action-review
    description: Current instructions for physical equipment actions require accountable review.
    when:
      category: policy
      subtype: physical_action_requires_review
    action: human_review
  - id: regulated-unverified-work-event-review
    description: Do not release categorical work-execution claims without a matching authorized record.
    when:
      category: policy
      subtype: unverified_operational_event
    action: human_review

# Phase-5 value-conflict hints are re-checked by NLI; a confirmed contradiction
# is held by the contradiction rule above. Any other unmatched HIGH finding is
# held for review by the policy engine.
informational_subtypes:
  - grounded_value_conflict
  - elevated_response_risk
  - unsupported_entity_claim

warning_template: This output is informational and must not replace the accountable human decision-maker.
blocked_response: This response was blocked under the regulated decision-support policy.
review_response: No automated recommendation is available. An accountable human reviewer must assess this case.
