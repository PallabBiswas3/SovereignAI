[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlplane-ai"
version = "0.2.0"
description = "Policy-driven responsible-AI gateway with adaptive factuality verification"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "numpy>=1.24,<2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "joblib>=1.3",
  "dateparser>=1.2",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
demo = ["streamlit>=1.37"]
judge = ["openai>=2.0"]
ml = [
  "xgboost>=2.0",
  "spacy>=3.7",
  "sentence-transformers>=3.0",
  "transformers>=4.45",
  "torch>=2.1",
  "accelerate>=0.34",
]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
