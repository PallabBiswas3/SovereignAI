name: NASA Battery Benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/tsdiag/tools/battery_prognosis.py'
      - 'src/tsdiag/domains/battery_prognosis_runner.py'
      - 'src/tsdiag/domains/battery_plugin.py'
      - 'src/tsdiag/pipeline.py'
      - 'src/tsdiag/registry.py'
      - 'src/tsdiag/datasets/battery_nasa.py'
      - 'src/tsdiag/benchmarks/battery_nasa.py'
      - 'scripts/run_battery_nasa_public_benchmark.py'
      - 'tests/test_battery_prognosis.py'
      - '.github/workflows/battery-nasa-benchmark.yml'

jobs:
  nasa-battery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install package
        run: python -m pip install -e '.[dev]'
      - name: Run fixed NASA cells through public diagnose path
        run: |
          python scripts/run_battery_nasa_public_benchmark.py \
            --data-dir data/nasa_battery \
            --output-dir outputs
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@v4
        with:
          name: battery-nasa-benchmark
          path: outputs/
          if-no-files-found: error
